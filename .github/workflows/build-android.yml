# Build Android APK for BirdAviary 2.0
# Builds a debug APK on every push to main, or manually via workflow_dispatch.
#
# ── Setup Required ──────────────────────────────────────────
# Add these secrets in GitHub → Settings → Secrets → Actions:
#
#   VITE_LICENSE_API_URL    - Your Apps Script Web App URL
#   VITE_HMAC_SECRET        - HMAC secret for license tokens

name: Build Android

on:
  workflow_dispatch:        # Manual trigger from GitHub UI
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'backend/**'

jobs:
  build-android:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      # ── Checkout ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Java ────────────────────────────────────────────
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      # ── Node.js ─────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── Environment ─────────────────────────────────────
      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || '923599076322-d4mo1qchirsu7bvu525pqur9fr3nld3d.apps.googleusercontent.com' }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET || '' }}
          GOOGLE_REDIRECT_URI=http://localhost:1420/auth/callback
          VITE_LICENSE_API_URL=${{ secrets.VITE_LICENSE_API_URL }}
          VITE_HMAC_SECRET=${{ secrets.VITE_HMAC_SECRET }}
          VITE_UPDATE_CHECK_URL=${{ secrets.VITE_UPDATE_CHECK_URL || '' }}
          EOF

      # ── Build Web Assets ────────────────────────────────
      - name: Build web app
        run: npx vite build

      # ── Capacitor Sync ──────────────────────────────────
      - name: Sync Capacitor Android
        run: npx cap sync android

      # ── Build APK ───────────────────────────────────────
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      # ── Upload Artifact ─────────────────────────────────
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BirdAviary2-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30