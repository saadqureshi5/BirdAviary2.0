# Build iOS IPA for BirdAviary 2.0
# This workflow builds an unsigned .app bundle on a macOS runner.
# The output can be sideloaded to your iPhone via AltStore/Sideloadly.
#
# ── Setup Required ──────────────────────────────────────────
# Add these secrets in GitHub → Settings → Secrets → Actions:
#
#   VITE_LICENSE_API_URL    - Your Apps Script Web App URL
#   VITE_HMAC_SECRET        - HMAC secret for license tokens
#
# ── Optional (for signed builds) ────────────────────────────
# If you have an Apple Developer account ($99/year), also add:
#
#   APPLE_CERTIFICATE_P12   - Base64-encoded .p12 signing certificate
#   APPLE_CERTIFICATE_PASSWORD - Password for the .p12 file
#   APPLE_PROVISIONING_PROFILE - Base64-encoded .mobileprovision
#   APPLE_TEAM_ID           - Your Apple Team ID
#
# Without these, the workflow builds an UNSIGNED .app (sideload via AltStore).
# With these, it builds a SIGNED .ipa (install via TestFlight or direct).

name: Build iOS

on:
  workflow_dispatch:        # Manual trigger from GitHub UI
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'backend/**'

jobs:
  build-ios:
    runs-on: macos-14       # Apple Silicon runner (M1) — free for public repos
    timeout-minutes: 30

    steps:
      # ── Checkout ────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── Node.js ─────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      # ── Environment ─────────────────────────────────────
      - name: Create .env file
        run: |
          cat > .env << 'EOF'
          GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID || '923599076322-d4mo1qchirsu7bvu525pqur9fr3nld3d.apps.googleusercontent.com' }}
          GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET || '' }}
          GOOGLE_REDIRECT_URI=http://localhost:1420/auth/callback
          VITE_LICENSE_API_URL=${{ secrets.VITE_LICENSE_API_URL }}
          VITE_HMAC_SECRET=${{ secrets.VITE_HMAC_SECRET }}
          VITE_UPDATE_CHECK_URL=${{ secrets.VITE_UPDATE_CHECK_URL || '' }}
          EOF

      # ── Build Web Assets ────────────────────────────────
      - name: Build web app
        run: npx vite build
        # Using 'vite build' directly to skip vue-tsc type-checking
        # (there are pre-existing TS errors in some views)

      # ── Capacitor Sync ──────────────────────────────────
      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # ── Select Xcode ────────────────────────────────────
      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer || sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      # ── Build (Unsigned) ────────────────────────────────
      - name: Build unsigned .app
        if: ${{ !secrets.APPLE_CERTIFICATE_P12 }}
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            -derivedDataPath build \
            clean build | tail -50

          # Find the .app bundle
          APP_PATH=$(find build -name "*.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> $GITHUB_ENV
          echo "✅ Built: $APP_PATH"

      # ── Package as IPA (Unsigned) ───────────────────────
      - name: Package unsigned IPA
        if: ${{ !secrets.APPLE_CERTIFICATE_P12 }}
        run: |
          mkdir -p output/Payload
          cp -R "$APP_PATH" output/Payload/
          cd output
          zip -r ../BirdAviary2-unsigned.ipa Payload
          echo "✅ IPA created: BirdAviary2-unsigned.ipa"

      # ── Build (Signed — if certificates provided) ───────
      - name: Import signing certificate
        if: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -hex 16)

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          echo "${{ secrets.APPLE_CERTIFICATE_P12 }}" | base64 --decode > $RUNNER_TEMP/cert.p12
          security import $RUNNER_TEMP/cert.p12 \
            -P "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

          # Install provisioning profile
          echo "${{ secrets.APPLE_PROVISIONING_PROFILE }}" | base64 --decode > $RUNNER_TEMP/profile.mobileprovision
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          cp $RUNNER_TEMP/profile.mobileprovision ~/Library/MobileDevice/Provisioning\ Profiles/

      - name: Build signed IPA
        if: ${{ secrets.APPLE_CERTIFICATE_P12 }}
        run: |
          cd ios/App
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath $RUNNER_TEMP/BirdAviary.xcarchive \
            DEVELOPMENT_TEAM="${{ secrets.APPLE_TEAM_ID }}" \
            clean archive | tail -50

          # Export IPA
          cat > $RUNNER_TEMP/ExportOptions.plist << PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>ad-hoc</string>
            <key>teamID</key>
            <string>${{ secrets.APPLE_TEAM_ID }}</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/BirdAviary.xcarchive \
            -exportOptionsPlist $RUNNER_TEMP/ExportOptions.plist \
            -exportPath output

          echo "✅ Signed IPA created"

      # ── Upload Artifact ─────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BirdAviary2-iOS
          path: |
            BirdAviary2-unsigned.ipa
            output/*.ipa
          if-no-files-found: error
          retention-days: 30
